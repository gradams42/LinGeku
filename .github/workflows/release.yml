name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build linux amd64/arm64/armhf
        run: scripts/build-release.sh amd64 arm64 armhf
      - uses: actions/upload-artifact@v4
        with:
          name: lingecu-linux
          path: build/release/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*
